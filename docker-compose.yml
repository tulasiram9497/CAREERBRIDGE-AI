version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerbridge-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MONGODB_URI=mongodb://mongo:27017/careerbridge
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  django-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerbridge-django
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - MONGODB_URI=mongodb://mongo:27017/careerbridge
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerbridge-worker
    command: celery -A celery_app worker --loglevel=info
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - MONGODB_URI=mongodb://mongo:27017/careerbridge
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: careerbridge-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: careerbridge-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo_data:
